[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-sift"
version = "0.1.0"
description = "Autonomous DFIR agent on SANS SIFT Workstation with MCP + Cloudflare AI Gateway"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "thtcsec" }]
keywords = ["dfir", "forensics", "mcp", "sift", "ai-agent", "incident-response"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
]
cloudflare = [
    "cloudflare>=3.0.0",
]

[project.scripts]
phantom-sift = "phantom_sift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom_sift"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM"]
ignore = ["S603", "S607"]  # subprocess calls are intentional for SIFT tools

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
